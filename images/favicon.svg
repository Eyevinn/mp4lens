<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The gopher is adapted from the Go gopher by Renée French (https://reneefrench.blogspot.com/), licensed under CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/). -->
  <defs>
    <clipPath id="lensClip"><circle cx="45" cy="45" r="10.5" /></clipPath>
  </defs>
  <!-- Rounded Dark Background for contrast on both light/dark browser tabs -->
  <rect width="64" height="64" rx="14" fill="#0f172a" />

  <!-- Gopher Ears -->
  <circle cx="13" cy="16" r="7" fill="#4cb0cc" stroke="#0f172a" stroke-width="2.5" />
  <circle cx="45" cy="16" r="7" fill="#4cb0cc" stroke="#0f172a" stroke-width="2.5" />

  <!-- Gopher Head -->
  <path d="M 8 34 C 8 10, 50 10, 50 34 L 52 56 C 52 60, 44 62, 29 62 C 14 62, 6 60, 6 56 Z"
        fill="#78d3e0" stroke="#0f172a" stroke-width="2.5" />

  <!-- Big Go Eyes, looking into the lens -->
  <circle cx="20" cy="28" r="9.5" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
  <circle cx="38" cy="28" r="9.5" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
  <circle cx="23" cy="30" r="4" fill="#0f172a" />
  <circle cx="41" cy="30" r="4" fill="#0f172a" />
  <circle cx="24.5" cy="28.5" r="1.5" fill="#ffffff" />
  <circle cx="42.5" cy="28.5" r="1.5" fill="#ffffff" />

  <!-- Snout & Teeth -->
  <rect x="25" y="40" width="4.5" height="7" rx="1" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
  <rect x="29.5" y="40" width="4.5" height="7" rx="1" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
  <ellipse cx="29" cy="38" rx="8.5" ry="4.5" fill="#e2d1b5" stroke="#0f172a" stroke-width="2" />
  <ellipse cx="29" cy="36" rx="4" ry="2.2" fill="#0f172a" />

  <!-- Lens (Bottom-Right Corner), magnifying box headers: size bytes (amber) and type bytes (blue) -->
  <line x1="53" y1="53" x2="58" y2="58" stroke="#0f172a" stroke-width="7" stroke-linecap="round" />
  <line x1="53" y1="53" x2="58" y2="58" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
  <circle cx="45" cy="45" r="15.5" fill="#0f172a" />
  <circle cx="45" cy="45" r="12" fill="#f8fafc" stroke="#f59e0b" stroke-width="3.5" />
  <g clip-path="url(#lensClip)">
    <rect x="36" y="37" width="3.5" height="4" rx="1" fill="#e08a00" />
    <rect x="40.5" y="37" width="5" height="4" rx="1" fill="#0b6b86" />
    <rect x="46.5" y="37" width="12" height="4" rx="1" fill="#94a3b8" />
    <rect x="39" y="43" width="3.5" height="4" rx="1" fill="#e08a00" />
    <rect x="43.5" y="43" width="5" height="4" rx="1" fill="#0b6b86" />
    <rect x="49.5" y="43" width="12" height="4" rx="1" fill="#475569" />
    <rect x="36" y="49" width="3.5" height="4" rx="1" fill="#e08a00" />
    <rect x="40.5" y="49" width="5" height="4" rx="1" fill="#0b6b86" />
    <rect x="46.5" y="49" width="12" height="4" rx="1" fill="#94a3b8" />
  </g>
</svg>

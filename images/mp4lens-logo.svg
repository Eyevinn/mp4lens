<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <!-- The gopher is adapted from the Go gopher by Renée French (https://reneefrench.blogspot.com/), licensed under CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/). -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="gopherTeal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78d3e0" />
      <stop offset="100%" stop-color="#4cb0cc" />
    </linearGradient>
    <clipPath id="lensClip"><circle cx="178" cy="138" r="35" /></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded Background Card -->
  <rect x="8" y="8" width="784" height="304" rx="24" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Subtle Background Grid Lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.35">
    <line x1="290" y1="8" x2="290" y2="312" stroke-dasharray="6 6" />
    <line x1="8" y1="245" x2="792" y2="245" />
  </g>

  <!-- ==================== GOPHER MASCOT ==================== -->
  <g transform="translate(42, 38)" filter="url(#shadow)">
    <!-- Left & Right Ears -->
    <circle cx="38" cy="42" r="18" fill="#4cb0cc" stroke="#0f172a" stroke-width="4.5" />
    <circle cx="38" cy="42" r="8" fill="#3896b0" />
    <circle cx="152" cy="42" r="18" fill="#4cb0cc" stroke="#0f172a" stroke-width="4.5" />
    <circle cx="152" cy="42" r="8" fill="#3896b0" />

    <!-- Gopher Body -->
    <path d="M 28 110 C 28 32, 162 32, 162 110 L 168 215 C 168 235, 148 242, 95 242 C 42 242, 22 235, 22 215 Z"
          fill="url(#gopherTeal)" stroke="#0f172a" stroke-width="5" />

    <!-- Lighter Belly Patch -->
    <ellipse cx="95" cy="175" rx="46" ry="52" fill="#a8e2ee" opacity="0.6" />

    <!-- Feet -->
    <ellipse cx="52" cy="238" rx="18" ry="10" fill="#e2d1b5" stroke="#0f172a" stroke-width="4" />
    <ellipse cx="138" cy="238" rx="18" ry="10" fill="#e2d1b5" stroke="#0f172a" stroke-width="4" />

    <!-- Big Go Eyes -->
    <circle cx="67" cy="88" r="26" fill="#ffffff" stroke="#0f172a" stroke-width="4.5" />
    <circle cx="123" cy="88" r="26" fill="#ffffff" stroke="#0f172a" stroke-width="4.5" />
    <!-- Pupils (looking down to the right, into the lens) -->
    <circle cx="77" cy="93" r="10" fill="#0f172a" />
    <circle cx="80" cy="89" r="3.5" fill="#ffffff" />
    <circle cx="133" cy="93" r="10" fill="#0f172a" />
    <circle cx="136" cy="89" r="3.5" fill="#ffffff" />

    <!-- Snout & Teeth -->
    <rect x="83" y="118" width="11" height="16" rx="2.5" fill="#ffffff" stroke="#0f172a" stroke-width="3.5" />
    <rect x="95" y="118" width="11" height="16" rx="2.5" fill="#ffffff" stroke="#0f172a" stroke-width="3.5" />
    <ellipse cx="95" cy="114" rx="22" ry="12" fill="#e2d1b5" stroke="#0f172a" stroke-width="4" />
    <!-- Nose -->
    <ellipse cx="95" cy="108" rx="10" ry="6" fill="#0f172a" />

    <!-- Left Arm -->
    <path d="M 26 142 C 8 155, 12 182, 34 185" fill="#4cb0cc" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" />

    <!-- Magnifying Glass Handle -->
    <line x1="203" y1="166" x2="232" y2="200" stroke="#0f172a" stroke-width="15" stroke-linecap="round" />
    <line x1="203" y1="166" x2="232" y2="200" stroke="#f59e0b" stroke-width="9" stroke-linecap="round" />

    <!-- Right Arm, its paw holding the handle -->
    <path d="M 160 150 C 182 152, 200 165, 212 180" fill="#4cb0cc" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" />
    <ellipse cx="215" cy="183" rx="9" ry="7" fill="#e2d1b5" stroke="#0f172a" stroke-width="3.5" transform="rotate(50 215 183)" />

    <!-- The Lens, magnifying box headers: size bytes (amber) and type bytes (blue), indented by nesting -->
    <circle cx="178" cy="138" r="42" fill="#0f172a" />
    <circle cx="178" cy="138" r="37" fill="#f8fafc" stroke="#f59e0b" stroke-width="6" />
    <g clip-path="url(#lensClip)">
      <rect x="140" y="133" width="80" height="12" fill="#cfe7f0" />
      <g transform="translate(152, 112)">
        <rect x="0" y="0" width="9" height="8" rx="2" fill="#e08a00" />
        <rect x="11" y="0" width="14" height="8" rx="2" fill="#0b6b86" />
        <rect x="27" y="0" width="40" height="8" rx="2" fill="#94a3b8" />
      </g>
      <g transform="translate(160, 123)">
        <rect x="0" y="0" width="9" height="8" rx="2" fill="#e08a00" />
        <rect x="11" y="0" width="14" height="8" rx="2" fill="#0b6b86" />
        <rect x="27" y="0" width="40" height="8" rx="2" fill="#94a3b8" />
      </g>
      <g transform="translate(168, 135)">
        <rect x="0" y="0" width="9" height="8" rx="2" fill="#e08a00" />
        <rect x="11" y="0" width="14" height="8" rx="2" fill="#0b6b86" />
        <rect x="27" y="0" width="40" height="8" rx="2" fill="#475569" />
      </g>
      <g transform="translate(160, 147)">
        <rect x="0" y="0" width="9" height="8" rx="2" fill="#e08a00" />
        <rect x="11" y="0" width="14" height="8" rx="2" fill="#0b6b86" />
        <rect x="27" y="0" width="40" height="8" rx="2" fill="#94a3b8" />
      </g>
      <g transform="translate(152, 158)">
        <rect x="0" y="0" width="9" height="8" rx="2" fill="#e08a00" />
        <rect x="11" y="0" width="14" height="8" rx="2" fill="#0b6b86" />
        <rect x="27" y="0" width="40" height="8" rx="2" fill="#94a3b8" />
      </g>
    </g>
    <!-- Glass Highlight -->
    <path d="M 154 122 A 28 28 0 0 1 168 110" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- ==================== TEXT & BOX GRAPHICS ==================== -->
  <!-- Top Pill Tags: top-level boxes, the selected one filled, and QuickTime -->
  <g transform="translate(300, 48)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" text-anchor="middle">
    <rect x="0" y="0" width="70" height="32" rx="8" fill="#1e293b" stroke="#4cb0cc" stroke-width="2" />
    <text x="35" y="21" fill="#4cb0cc">ftyp</text>
    <rect x="80" y="0" width="70" height="32" rx="8" fill="#4cb0cc" stroke="#4cb0cc" stroke-width="2" />
    <text x="115" y="21" fill="#0f172a">moov</text>
    <rect x="160" y="0" width="70" height="32" rx="8" fill="#1e293b" stroke="#4cb0cc" stroke-width="2" />
    <text x="195" y="21" fill="#4cb0cc">mdat</text>

    <!-- QuickTime -->
    <g transform="translate(246, 0)">
      <rect x="0" y="0" width="142" height="32" rx="16" fill="#1e293b" stroke="#7da2f0" stroke-width="2" />
      <circle cx="20" cy="16" r="5" fill="#7da2f0" />
      <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#b4c8f7" text-anchor="start" letter-spacing="0.8">QUICKTIME</text>
    </g>
  </g>

  <!-- Main Title: mp4lens -->
  <text x="300" y="155" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-1.5">
    <tspan fill="#4cb0cc">mp4</tspan><tspan fill="#f8fafc">lens</tspan>
  </text>

  <!-- Two-line Subtitle -->
  <text x="302" y="202" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#7fd5ea" letter-spacing="2.5">
    MP4 &amp; QUICKTIME
  </text>
  <text x="302" y="234" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#94a3b8" letter-spacing="3">
    BOX VIEWER IN GO
  </text>

  <!-- Bottom Byte Strip: the header of an ftyp box, its size bytes (amber), type bytes (blue) and payload -->
  <g transform="translate(302, 258)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    <g fill="#3a2d14" stroke="#f0b356" stroke-width="1.5">
      <rect x="0" y="0" width="30" height="22" rx="4" />
      <rect x="36" y="0" width="30" height="22" rx="4" />
      <rect x="72" y="0" width="30" height="22" rx="4" />
      <rect x="108" y="0" width="30" height="22" rx="4" />
    </g>
    <g fill="#f0b356">
      <text x="15" y="15.5">00</text>
      <text x="51" y="15.5">00</text>
      <text x="87" y="15.5">00</text>
      <text x="123" y="15.5">20</text>
    </g>
    <g fill="#12313b" stroke="#4cb0cc" stroke-width="1.5">
      <rect x="148" y="0" width="30" height="22" rx="4" />
      <rect x="184" y="0" width="30" height="22" rx="4" />
      <rect x="220" y="0" width="30" height="22" rx="4" />
      <rect x="256" y="0" width="30" height="22" rx="4" />
    </g>
    <g fill="#7fd5ea">
      <text x="163" y="15.5">66</text>
      <text x="199" y="15.5">74</text>
      <text x="235" y="15.5">79</text>
      <text x="271" y="15.5">70</text>
    </g>
    <g fill="#64748b">
      <text x="311" y="15.5">69</text>
      <text x="347" y="15.5">73</text>
      <text x="383" y="15.5">6F</text>
      <text x="419" y="15.5">6D</text>
    </g>
  </g>
</svg>

name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekdays 08:17 UTC: re-scan unchanged code against the latest vuln
    # database, so a newly-disclosed dependency or stdlib CVE surfaces
    # even without a commit. Off the hour, when every scheduled workflow
    # on the platform starts.
    - cron: "17 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Not pinned to the go.mod minimum like go.yml: govulncheck@latest
      # tracks the current Go release, and setup-go sets GOTOOLCHAIN=local,
      # so an older toolchain cannot build the scanner (x/vuln v1.8.0 needs
      # Go 1.26). Stdlib findings are therefore reported against the latest
      # release, which is what users of the module should build with.
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      # Reachability-based scan: fails only on vulnerabilities this module
      # actually calls (dependencies and the Go stdlib). Vulns present but
      # unreachable are reported, not failed on.
      - name: Run govulncheck
        run: make vulncheck

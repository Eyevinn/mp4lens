version: 2

builds:
  - id: mp4lens
    main: ./cmd/mp4lens
    binary: mp4lens
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

nfpms:
  - package_name: mp4lens
    homepage: https://github.com/Eyevinn/mp4lens
    maintainer: "Eyevinn Technology <info@eyevinn.se>"
    description: "Look inside MP4 and QuickTime files: box tree, fields, bytes and search, in the terminal"
    license: MIT
    formats:
      - deb
      - rpm
      - apk

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
